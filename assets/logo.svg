<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Estilo para carregar e aplicar a fonte Monaspace Neon -->
    <style>
      @import url('https://cdn.jsdelivr.net/gh/githubnext/monaspace@v1.000/fonts/webfonts/monaspace-neon.css');

      .bg-pill {
        fill: #1e2025; /* Fundo arredondado estilo Material You */
        stroke: #2d3038;
        stroke-width: 1.5;
      }
      
      .text-mono {
        font-family: 'Monaspace Neon', 'Courier New', monospace;
        font-weight: 700;
        font-size: 42px;
        letter-spacing: -1px;
      }

      .text-mono {
        fill: #e1e2e8; /* Texto claro monocromático */
      }

      .text-you {
        fill: #8b90a0; /* Destaque sutil no "You" com tom slate */
      }

      .badge-bg {
        fill: #2b2e37;
        rx: 16;
      }

      .badge-text {
        font-family: 'Monaspace Neon', monospace;
        font-size: 13px;
        fill: #9aa0b4;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Container arredondado (Pill Material You) -->
  <rect x="10" y="10" width="500" height="120" rx="28" class="bg-pill" />

  <!-- Badge / Destaque de Pílula menor estilo Material 3 -->
  <rect x="36" y="32" width="80" height="26" class="badge-bg" />
  <text x="76" y="49" text-anchor="middle" class="badge-text">THEME</text>

  <!-- Texto Principal com Monaspace Neon -->
  <text x="36" y="98" class="text-mono">
    Mono<tspan class="text-you">You</tspan>
  </text>
  
  <!-- Detalhe decorativo de código em Material You -->
  <rect x="420" y="50" width="40" height="40" rx="12" fill="#2d313b" />
  <circle cx="440" cy="70" r="6" fill="#8b90a0" />
</svg>
